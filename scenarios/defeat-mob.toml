name = "defeat-mob"
about = "RW-2: LOCAL dies to something that is not a player (no rival hit): nothing is held, the game's own comeback respawns it, it is not defeated"
tags = ["rules"]

[config]
mode = "offline"
mm_queue = false
team_size = 1
ui_flag_watch = false

[[step]]
navigate = "title_to_world"
[[step]]
navigate = "expedition"
god = false   # a mob death is the point: no god mode
[[step]]
puppets = 3
[[step]]
puppet_ring = 6
[[step]]
console = "flag 10007420 1"
[[step]]
console = "hp0"
[[step]]
wait_log = { contains = "died to an enemy", timeout_s = 40, since = "run" }
[[step]]
sleep_ms = 25000
[[step]]
screenshot = "after"
[[step]]
console = "night_status"
[[step]]
expect = { console = "night_status", contains = ["LOCAL in", "mob deaths 1"], absent = ["defeated"] }
[[step]]
expect_log = { contains = ["died to an enemy"], absent = ["defeated by", "start step HELD", "panicked at", "no free hardware slot"], since = "run" }
