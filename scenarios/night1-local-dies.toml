name = "night1-local-dies"
about = "M5-9: LOCAL is put at 0 HP at night 1 with puppets in the game; the death is held, released at the morning, LOCAL is moved to a day-1 place only after the Day-2 clock, alive"

[config]
mode = "offline"
mm_queue = false
team_size = 1
ui_flag_watch = false

[[step]]
navigate = "title_to_world"
[[step]]
navigate = "expedition"
[[step]]
console = "god 1"
[[step]]
puppets = 3
[[step]]
puppet_ring = 4
[[step]]
console = "clock end"
[[step]]
wait = { console = "night_status", contains = "night 1", timeout_s = 60 }
[[step]]
console = "puppet_list"
[[step]]
console = "hp0"
[[step]]
wait = { console = "log 300", contains = "start step HELD", timeout_s = 40 }
[[step]]
screenshot = "dead"
[[step]]
expect = { console = "night_status", contains = ["night 1", "death held"] }
[[step]]
console = "puppet_list"
[[step]]
sleep_ms = 15000
[[step]]
console = "night_end"
[[step]]
wait = { console = "log 300", contains = "RELEASED", timeout_s = 20 }
[[step]]
wait = { console = "log 300", contains = "moved to a random day-1 place", timeout_s = 90 }
[[step]]
expect = { console = "clock", contains = "07:" }
[[step]]
sleep_ms = 8000
[[step]]
screenshot = "alive"
[[step]]
expect = { console = "night_status", contains = ["day 2", "death released"] }
[[step]]
expect = { console = "log 300", contains = ["console hp0: LOCAL HP", "night 1 is over", "LOCAL is dead; releasing"], absent = ["no free hardware slot", "panic"] }
