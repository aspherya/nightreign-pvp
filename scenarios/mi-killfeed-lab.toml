name = "mi-killfeed-lab"
about = "KF-1 lab: two emulated instances in one Battle Royale expedition as rivals, on the ground 3 m apart, and both games stay open (teardown keep) so a person can fight with real hits and watch the killfeed"
tags = ["mi", "lab"]
teardown = "keep"
# Two emulated-Steam instances (MULTI-INSTANCE.md §20): Steam closed, `nro desk` running.
# An idle match ends by itself after 12 minutes (TRAPS). End with: nro stop --all
# Run: nro run scenarios\mi-killfeed-lab.toml

[config]            # every instance
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 2
mm_join = true
mm_quiet_invite = true
mm_host_create = false   # never: a lobby made by the mod is not joinable (MATCHMAKING §8)

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

# Instance 1 queues first, so its queue lobby is the one instance 2 finds and joins (the lobby owner becomes the host).
[[step]]
instance = 1
console = "mm_queue_solo"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 30 }

[[step]]
instance = 2
console = "mm_queue_solo"

[[step]]
instance = 2
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 60 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 30 }

[[step]]
instance = 1
navigate = "invite_members"

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
navigate = "commence_br"

[[step]]
instance = 2
navigate = "commence_br"

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 2
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 1
sleep_ms = 6000

[[step]]
instance = 1
console = "hawk_drop"

[[step]]
instance = 2
console = "hawk_drop"

[[step]]
instance = 1
sleep_ms = 14000

# Safe landing: kill the enemies near both players (wolves killed a player mid-test once).
[[step]]
instance = 1
console = "mob_kill"

[[step]]
instance = 2
console = "mob_kill"

[[step]]
instance = 1
console = "mob_kill"

[[step]]
instance = 2
console = "mob_kill"

# The toast table is found about 35 s after launch and a line waits for it, but the photos must catch the toast.
[[step]]
instance = 1
wait_log = { contains = ["toastfilter: scanned", "copy(ies) of UserDispLogParam"], timeout_s = 90, since = "run" }

[[step]]
instance = 2
wait_log = { contains = ["toastfilter: scanned", "copy(ies) of UserDispLogParam"], timeout_s = 90, since = "run" }

# No die-at-once effect from older scenarios on either game, so 0 HP is a downed state (TRAPS).
[[step]]
instance = 1
console = "flag 10007420 0"

[[step]]
instance = 2
console = "flag 10007420 0"

# Side by side, and no enemies around.
[[step]]
instance = 2
console = "tp_player 1 0 3"

[[step]]
instance = 1
sleep_ms = 3000

[[step]]
instance = 1
console = "mob_kill"

[[step]]
instance = 1
console = "mob_kill"

[[step]]
instance = 1
screenshot = "lab_ready_p1"

[[step]]
instance = 2
screenshot = "lab_ready_p2"
