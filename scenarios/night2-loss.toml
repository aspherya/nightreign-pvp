name = "night2-loss"
about = "M5-5 open item: night 2 decided by count, LOCAL dead and held, a puppet is the last standing: loss flag 7001"

[config]
mode = "offline"
mm_queue = false
team_size = 1
ui_flag_watch = false

[[step]]
navigate = "title_to_world"
[[step]]
navigate = "expedition"
[[step]]
console = "god 1"
[[step]]
puppets = 3
[[step]]
puppet_front = 1.2
[[step]]
console = "clock end"
[[step]]
wait = { console = "night_status", contains = "night 1", timeout_s = 60 }
[[step]]
sleep_ms = 5000
[[step]]
console = "night_end"
[[step]]
wait = { console = "night_status", contains = "day 2", timeout_s = 60 }
[[step]]
wait = { console = "clock", contains = "07:", timeout_s = 90 }
[[step]]
sleep_ms = 20000
[[step]]
console = "puppet_list"
[[step]]
console = "clock end"
[[step]]
wait = { console = "night_status", contains = "night 2", timeout_s = 60 }
[[step]]
console = "puppet_list"
[[step]]
console = "puppet_hp 1 0"
[[step]]
console = "puppet_hp 2 0"

[[step]]
sleep_ms = 2000
[[step]]
console = "puppet_list"
[[step]]
console = "hp0"
[[step]]
wait = { console = "log 300", contains = "night 2 decided", timeout_s = 40 }
[[step]]
sleep_ms = 4000
[[step]]
screenshot = "loss"
[[step]]
sleep_ms = 6000
[[step]]
screenshot = "loss2"
[[step]]
sleep_ms = 8000
[[step]]
screenshot = "loss3"
[[step]]
console = "flag 7000"
[[step]]
console = "flag 7001"
[[step]]
console = "night_status"
[[step]]
expect = { console = "log 300", contains = ["night 2 decided", "start step HELD"], absent = ["no free hardware slot", "panic"] }
