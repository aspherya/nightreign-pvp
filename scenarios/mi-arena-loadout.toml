name = "mi-arena-loadout"
about = "ARENA-3 acceptance on two instances: mi-arena-queue's way into the arena, with a loadout given by `give` at the Roundtable (instance 1 a Blood Uchigatana +0 in R1, instance 2 Marais in R1) and a 20 s round limit; in the arena both games are at level 15 with the max-upgrade ids in their slots (Uchigatana +3, Marais +0), nobody fights, the first round times out, the host publishes a draw (full HP on both) and both games show the same draw"
tags = ["mi"]
# Two emulated-Steam instances (MULTI-INSTANCE.md 20): Steam closed, `nro desk` running, the PC untouched while it runs. Needs the DEV
# DLL and game data (the Arena card hook, the warp, Heolstor off and his fight off are dev only).
# Run: nro run scenarios\mi-arena-loadout.toml

[config]            # every instance, as mi-zero-click
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 2
mm_join = true
mm_quiet_invite = true
mm_auto_start = true
br_menu = true
mm_host_create = false

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

# ARENA-3: a loadout at the Roundtable and a short round limit, then wait for the capture.
[[step]]
instance = 1
console = "give 0089588C 1 1"

[[step]]
instance = 2
console = "give 003010B0 1 1"

[[step]]
instance = 1
console = "arena_limit 20"

[[step]]
instance = 2
console = "arena_limit 20"

[[step]]
instance = 1
wait_log = { contains = ["arena_loadout: captured", "s1 0089588C"], timeout_s = 20, since = "run" }

[[step]]
instance = 2
wait_log = { contains = ["arena_loadout: captured", "s1 003010B0"], timeout_s = 20, since = "run" }

# Instance 1 queues first, so it owns the queue lobby. The player's way: at the table, F opens the menu, DOWN to the Arena card, F
# picks it, F is Commence, F closes our dialog.
[[step]]
instance = 1
navigate = "queue_arena"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 20 }

[[step]]
instance = 1
expect_log = { contains = ["queue Arena Solo (sent)", "kind=arena"], since = "run" }

[[step]]
instance = 2
navigate = "queue_arena"

[[step]]
instance = 1
mark = "pressed"

[[step]]
instance = 2
mark = "pressed"

# From here on no key and no click: only watching.
[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 240, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 90, every_ms = 2000 }

[[step]]
instance = 1
wait_log = { contains = ["arena: flag 10007500 ON"], timeout_s = 60, since = "mark:pressed" }

[[step]]
instance = 2
wait_log = { contains = ["arena: flag 10007500 ON"], timeout_s = 60, since = "mark:pressed" }

[[step]]
instance = 1
wait_log = { contains = ["arena: roster team"], timeout_s = 90, since = "mark:pressed" }

[[step]]
instance = 2
wait_log = { contains = ["arena: roster team"], timeout_s = 90, since = "mark:pressed" }

[[step]]
instance = 1
keys = "wait 3000ms"

[[step]]
instance = 1
console = "pos"

[[step]]
instance = 2
console = "pos"

[[step]]
instance = 1
console = "players_pos"

[[step]]
instance = 2
console = "players_pos"

[[step]]
instance = 1
screenshot = "p1_spawn"

[[step]]
instance = 2
screenshot = "p2_spawn"

# Verdict: each game placed its player by a known roster team (not the fallback), both still see each other as rivals.
[[step]]
instance = 1
expect_log = { contains = ["arena: roster team Some(", "teleport: LOCAL to world"], absent = ["spawn move failed", "no arrival at Heolstor's arena"], since = "mark:pressed" }

[[step]]
instance = 2
expect_log = { contains = ["arena: roster team Some(", "teleport: LOCAL to world"], absent = ["spawn move failed", "no arrival at Heolstor's arena"], since = "mark:pressed" }

[[step]]
instance = 1
expect = { console = "players", contains = ["me", "rival"] }

[[step]]
instance = 2
expect = { console = "players", contains = ["me", "rival"] }

# ARENA-3: the loadout at the spawn.
[[step]]
instance = 1
wait_log = { contains = ["arena_loadout: applying", "s1 0089588C->0089588F", "arena_loadout: level -> 15", "inventory: equip slot 1"], timeout_s = 30, since = "mark:pressed" }

[[step]]
instance = 2
wait_log = { contains = ["arena_loadout: applying", "s1 003010B0->003010B0", "arena_loadout: level -> 15", "inventory: equip slot 1"], timeout_s = 30, since = "mark:pressed" }

[[step]]
instance = 1
expect = { console = "inv", contains = ["level 15", "0089588F"] }

[[step]]
instance = 2
expect = { console = "inv", contains = ["level 15", "003010B0"] }

# Arena test 2026-11-12: each player saw the rival with its starting weapon. Each game must hold the RIVAL's loadout in its copy of
# the rival (what it draws), sent by the game's own player-data broadcast after the loadout.
[[step]]
instance = 1
wait = { console = "rival_gear", contains = ["; other 0 [", "003010B0"], timeout_s = 20, every_ms = 1000 }

[[step]]
instance = 2
wait = { console = "rival_gear", contains = ["; other 0 [", "0089588F"], timeout_s = 20, every_ms = 1000 }

[[step]]
instance = 1
screenshot = "p1_loadout"

[[step]]
instance = 2
screenshot = "p2_loadout"

# ARENA-3: nobody fights; the 20 s limit ends round 1 as a draw on both games (the host judges and publishes).
[[step]]
instance = 1
wait_log = { contains = ["bout 1 timed out: Draw for the host (published true)", "Round 1: time! draw"], timeout_s = 60, since = "mark:pressed" }

[[step]]
instance = 2
wait_log = { contains = ["the host's verdict for bout 1: Draw", "Round 1: time! draw"], timeout_s = 30, since = "mark:pressed" }

[[step]]
instance = 2
expect_log = { absent = ["no verdict", "EXCEPTION"], since = "mark:pressed" }
