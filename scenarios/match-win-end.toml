name = "match-win-end"
about = "RW-1: as match-win, then the end flow: Result, Reward, Next presses, back at the Roundtable"
tags = ["rules", "slow"]

[config]
mode = "offline"
mm_queue = false
team_size = 1
ui_flag_watch = false

[[step]]
navigate = "title_to_world"
[[step]]
navigate = "expedition"
[[step]]
puppets = 3
[[step]]
puppet_front = 1.2
[[step]]
console = "puppet_hp 1 0"
[[step]]
console = "puppet_hp 2 0"
[[step]]
console = "puppet_hp 3 0"
[[step]]
wait_log = { contains = "match decided", timeout_s = 60, since = "run" }
[[step]]
sleep_ms = 4000
[[step]]
screenshot = "win"
[[step]]
sleep_ms = 8000
[[step]]
screenshot = "win2"
[[step]]
expect_log = { contains = ["match decided", "won"], absent = ["panicked at", "no free hardware slot"], since = "run" }
[[step]]
keys = "F; wait 3s"
[[step]]
screenshot = "end1"
[[step]]
keys = "F; wait 3s"
[[step]]
screenshot = "end2"
[[step]]
keys = "F; wait 4s"
[[step]]
screenshot = "end3"
[[step]]
keys = "F; wait 6s"
[[step]]
screenshot = "end4"
[[step]]
wait = { console = "status", contains = "team_type 1", timeout_s = 90 }
[[step]]
screenshot = "roundtable"
[[step]]
console = "status"
