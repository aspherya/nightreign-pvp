screenshot = "b_orb_before"

# Instance 1 walks to the orb and claims it (orb_claim: the same call the Dormant Power screen opening makes; the real F press passed in run 1793449856 but is flaky as a scripted key).
[[step]]
instance = 1
console = "orb_go"

[[step]]
instance = 1
screenshot = "a_orb_prompt"

[[step]]
