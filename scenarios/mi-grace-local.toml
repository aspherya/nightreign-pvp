name = "mi-grace-local"
about = "GRACE-1: two emulated instances reach the same expedition as rivals; a rival hit on player 1 puts the grace lock ON (flag 7525) in game 1 only: game 2 keeps flag 7525 off and its lock off, also while game 1 is locked; game 1 releases after the timer"
tags = ["mi", "rules", "slow"]
# Two emulated-Steam instances (MULTI-INSTANCE.md §20): Steam closed, `nro desk` running. The queue is allowed only on emulated
# instances (preflight P7) and nro refuses `mm_queue_*` unless the mod log shows the instance's emulated Steam id.
# Run: nro run scenarios\mi-grace-local.toml

[config]            # every instance
team_size = 1
ui_flag_watch = false
grace_combat_secs = 15
mm_probe = true
mm_queue = true
mm_match_players = 2
mm_join = true
mm_quiet_invite = true
mm_host_create = false   # never: a lobby made by the mod is not joinable (MATCHMAKING §8)

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

# Instance 1 queues first, so its queue lobby is the one instance 2 finds and joins (the lobby owner becomes the host).
[[step]]
instance = 1
console = "mm_queue_solo"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 30 }

[[step]]
instance = 2
console = "mm_queue_solo"

[[step]]
instance = 2
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 60 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 30 }

[[step]]
instance = 1
screenshot = "host_match_ready"

# The host opens its Seamless Co-op lobby the player's way (Matchmaking Settings > Invite Members); the quiet invite swallows the
# invite window, the host's mod invites the roster, gbe auto-accepts on the joiner.
[[step]]
instance = 1
navigate = "invite_members"

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 2
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 1
expect_log = { contains = ["mm_join: ALL PRESENT 2/2"], since = "run" }

[[step]]
instance = 1
screenshot = "host"

[[step]]
instance = 2
screenshot = "joiner"

# The expedition: every party member readies at the table (the party list counts n/2), the host first.
[[step]]
instance = 1
navigate = "commence_br"

[[step]]
instance = 2
navigate = "commence_br"

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 2
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

# Player 1 stands next to player 2 (inside the lock ranges), then takes a rival hit.
[[step]]
instance = 1
console = "tp_player 1 5 0"

[[step]]
instance = 1
mark = "hit"

[[step]]
instance = 1
console = "rival_hit"

[[step]]
instance = 1
wait_log = { contains = "grace_lock: ON (a rival hit me)", timeout_s = 15, since = "mark:hit" }

[[step]]
instance = 1
expect = { console = "grace_status", contains = ["flag 7525 ON"] }

# The other game must not follow.
[[step]]
instance = 2
sleep_ms = 3000

[[step]]
instance = 2
expect = { console = "grace_status", contains = ["flag 7525 off"] }

[[step]]
instance = 2
expect = { console = "grace_lock", contains = ["off"], absent = ["ON"] }

[[step]]
instance = 1
screenshot = "locked"

[[step]]
instance = 1
wait_log = { contains = "grace_lock: OFF", timeout_s = 30, since = "mark:hit" }

[[step]]
instance = 1
expect = { console = "grace_status", contains = ["flag 7525 off"] }

[[step]]
instance = 2
expect_log = { absent = ["grace_lock: ON", "panicked at"], since = "run" }
