name = "mi-bots-sync"
about = "BOT-0 spike: two emulated instances in one Battle Royale expedition; the host spawns the game's own NPC bots (first with the solo gate as it is, then held at 1) and both games list every bot-like character, to see whether the host's bots exist on the client"
tags = ["mi", "lab"]
# Two emulated-Steam instances (MULTI-INSTANCE.md §20): Steam closed, `nro desk` running. Dev DLL with `bots_scan` / `bots_gate`.
# Run: scripts/regress.ps1 mi-bots-sync. The answer is in the console replies of report.json and the screenshots (BOTS.md §2f).

[config]            # every instance
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 2
mm_join = true
mm_quiet_invite = true
mm_host_create = false   # never: a lobby made by the mod is not joinable (MATCHMAKING §8)

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

# Instance 1 queues first, so its queue lobby is the one instance 2 finds and joins (the lobby owner becomes the host).
[[step]]
instance = 1
console = "mm_queue_solo"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 30 }

[[step]]
instance = 2
console = "mm_queue_solo"

[[step]]
instance = 2
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 60 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 30 }

[[step]]
instance = 1
navigate = "invite_members"

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
navigate = "commence_br"

[[step]]
instance = 2
navigate = "commence_br"

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 2
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 1
sleep_ms = 6000

[[step]]
instance = 1
console = "hawk_drop"

[[step]]
instance = 2
console = "hawk_drop"

[[step]]
instance = 1
sleep_ms = 14000

# Safe landing: kill the enemies near both players (wolves killed a player mid-test once).
[[step]]
instance = 1
console = "mob_kill"

[[step]]
instance = 2
console = "mob_kill"

[[step]]
instance = 1
console = "mob_kill"

[[step]]
instance = 2
console = "mob_kill"

# The toast table is found about 35 s after launch and a line waits for it, but the photos must catch the toast.
[[step]]
instance = 1
wait_log = { contains = ["toastfilter: scanned", "copy(ies) of UserDispLogParam"], timeout_s = 90, since = "run" }

[[step]]
instance = 2
wait_log = { contains = ["toastfilter: scanned", "copy(ies) of UserDispLogParam"], timeout_s = 90, since = "run" }

# Baseline: the gate on both games, every bot-like character (small-base invaders included) before any bot.
[[step]]
instance = 1
console = "bots_gate"
[[step]]
instance = 2
console = "bots_gate"
[[step]]
instance = 1
console = "bots_scan"
[[step]]
instance = 2
console = "bots_scan"

# 1. The gate as it is: does 2003[97] refuse in a session?
[[step]]
instance = 1
console = "bots 10"
[[step]]
instance = 1
sleep_ms = 6000
[[step]]
instance = 1
console = "bots"
[[step]]
instance = 1
console = "bots_scan"
[[step]]
instance = 2
console = "bots_scan"
[[step]]
instance = 1
screenshot = "gate_as_is_p1"
[[step]]
instance = 2
screenshot = "gate_as_is_p2"

# 2. The gate held at 1 while the flag is set.
[[step]]
instance = 1
console = "bots_gate hold 4000"
[[step]]
instance = 1
console = "bots 10"
[[step]]
instance = 1
sleep_ms = 8000
[[step]]
instance = 1
console = "bots"
[[step]]
instance = 1
console = "bots_gate"
[[step]]
instance = 1
console = "bots_scan"
[[step]]
instance = 2
console = "bots_scan"
[[step]]
instance = 1
screenshot = "held_p1"
[[step]]
instance = 2
screenshot = "held_p2"

# A late look on the client (a remote character may take time to arrive).
[[step]]
instance = 1
sleep_ms = 15000
[[step]]
instance = 1
console = "bots_scan"
[[step]]
instance = 2
console = "bots_scan"
[[step]]
instance = 1
screenshot = "late_p1"
[[step]]
instance = 2
screenshot = "late_p2"
