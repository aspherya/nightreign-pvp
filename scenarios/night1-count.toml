name = "night1-count"
about = "M5-5: night 1 with LOCAL + 3 AFK puppets is decided by count when the puppets are down; the morning follows, the winner is healed"

[config]
mode = "offline"
mm_queue = false
team_size = 1
ui_flag_watch = false

[[step]]
navigate = "title_to_world"
[[step]]
navigate = "expedition"
[[step]]
console = "god 1"
[[step]]
puppets = 3
[[step]]
puppet_front = 1.2
[[step]]
console = "puppet_hp 1 0"
[[step]]
console = "puppet_hp 2 0"
[[step]]
console = "puppet_hp 3 0"
[[step]]
console = "clock end"
[[step]]
wait = { console = "night_status", contains = "night 1", timeout_s = 60 }
[[step]]
screenshot = "night"
[[step]]
console = "night_status"
[[step]]
console = "puppet_list"
[[step]]
wait = { console = "log 300", contains = "night 1 decided", timeout_s = 40 }
[[step]]
wait = { console = "log 300", contains = "night 1 is over", timeout_s = 30 }
[[step]]
sleep_ms = 10000
[[step]]
console = "night_status"
[[step]]
screenshot = "morning"
[[step]]
expect = { console = "log 300", contains = ["night 1 decided", "won", "night 1 is over"], absent = ["no free hardware slot", "panic"] }
