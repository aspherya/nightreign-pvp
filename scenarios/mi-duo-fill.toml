name = "mi-duo-fill"
about = "MM-FILL: two single players (no party, no Invite Members) queue Duo and are packed into one team: MATCH READY lists team=0 for both, the match starts by itself (mm_auto_start), and in the expedition both games take the teams from the queue roster (`teams (roster)`) and see the other player as an ally"
tags = ["mi", "slow"]
# Two emulated-Steam instances (MULTI-INSTANCE.md 20): Steam closed, `nro desk` running.
# Run: nro run scenarios\mi-duo-fill.toml --mod-dist <dev dist>
# Note: `navigate = "queue_br"` always picks Solo (it checks `players byte 2`), so the queue is started with the console command
# `mm_queue_duo` (as mi-duo-party); the start itself is the zero-click path of mi-zero-click (mm_auto_start), no Commence key.

[config]            # every instance
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 2    # min = max = 2: one Duo team of two fills the lobby
mm_join = true
mm_quiet_invite = true
mm_auto_start = true
br_menu = true
mm_host_create = false   # never: a lobby made by the mod is not joinable (MATCHMAKING 8)

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

# Instance 1 queues first, so it owns the queue lobby and becomes the host. Neither has a Seamless Co-op party: each is a ticket of one.
[[step]]
instance = 1
console = "mm_queue_duo"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 30 }

[[step]]
instance = 2
console = "mm_queue_duo"

[[step]]
instance = 2
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 60 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 30 }

# The queue packed the two singles into one team: team 0 for both, on both logs.
[[step]]
instance = 1
expect_log = { contains = ["roster member", "team=0"], absent = ["team=1"], since = "run" }

[[step]]
instance = 2
expect_log = { contains = ["roster member", "team=0"], absent = ["team=1"], since = "run" }

# From here on no key and no click: the host's game makes its lobby, the joiner comes in, both are marked ready.
[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 180, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 90, every_ms = 2000 }

# The match took its teams from the roster, and the other player is an ally.
[[step]]
instance = 1
wait = { console = "players", contains = ["me", "ally"], absent = ["rival", "panic"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 2
wait = { console = "players", contains = ["me", "ally"], absent = ["rival", "panic"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 1
expect_log = { contains = ["mm_team: pid", "teams (roster)"], since = "run" }

[[step]]
instance = 2
expect_log = { contains = ["mm_team: pid", "teams (roster)"], since = "run" }

[[step]]
instance = 1
screenshot = "host_expedition"

[[step]]
instance = 2
screenshot = "joiner_expedition"
