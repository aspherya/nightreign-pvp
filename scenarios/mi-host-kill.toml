name = "mi-host-kill"
about = "MM-9 lab with THREE emulated instances (RAM heavy): all three queue Solo, reach the same expedition as rivals and stay open (teardown keep); then the host's game is killed by hand (nro stop --i 1) and the two clients are observed (nro cmd status --i 2, nro shot x --i 3)"
tags = ["mi", "slow", "lab"]
teardown = "keep"
# Three emulated-Steam instances (MULTI-INSTANCE.md §20): Steam closed, `nro desk` running, about 8 GB of RAM per game (free RAM can fall to ~0).
# Run: nro run scenarios\mi-host-kill.toml --mod-dist <dev dist>

[config]            # every instance
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 3
mm_join = true
mm_quiet_invite = true
mm_host_create = false   # never: a lobby made by the mod is not joinable (MATCHMAKING §8)

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[instance]]
n = 3
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

[[step]]
instance = 3
navigate = "title_to_world"

# Instance 1 queues first, so its queue lobby is the one the others find and join (the lobby owner becomes the host).
[[step]]
instance = 1
console = "mm_queue_solo"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 30 }

[[step]]
instance = 2
console = "mm_queue_solo"

[[step]]
instance = 3
console = "mm_queue_solo"

[[step]]
instance = 3
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 90 }

[[step]]
instance = 2
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 60 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 60 }

# The host opens its Seamless Co-op lobby the player's way; the others join it.
[[step]]
instance = 1
navigate = "invite_members"

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 3 player(s)", "team_type 1"], timeout_s = 150, every_ms = 2000 }

[[step]]
instance = 3
wait = { console = "status", contains = ["world loaded, 3 player(s)", "team_type 1"], timeout_s = 150, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 90, every_ms = 2000 }

# The expedition: every member readies at the table, the host first.
[[step]]
instance = 1
navigate = "commence"

[[step]]
instance = 2
navigate = "commence"

[[step]]
instance = 3
navigate = "commence"

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 3 player(s)", "team_type 2"], timeout_s = 150, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 3 player(s)", "team_type 2"], timeout_s = 90, every_ms = 2000 }

[[step]]
instance = 3
wait = { console = "status", contains = ["world loaded, 3 player(s)", "team_type 2"], timeout_s = 90, every_ms = 2000 }

[[step]]
instance = 1
expect = { console = "mm_status", contains = ["IN EXPEDITION"] }

[[step]]
instance = 2
expect = { console = "mm_status", contains = ["IN EXPEDITION"] }

[[step]]
instance = 3
expect = { console = "mm_status", contains = ["IN EXPEDITION"] }

[[step]]
instance = 2
console = "players"

[[step]]
instance = 2
screenshot = "client2_expedition"

[[step]]
instance = 3
screenshot = "client3_expedition"
