name = "mi-rw8-runes"
about = "RW-8 on one PC: two emulated instances queue Solo and reach the same expedition as rivals; player 1 kills an enemy next to player 2 (test aid `mob_kill`: LOCAL as the enemy's attacker + HP 0, the fields a real hit fills); with runeshare on (auto) player 1 is credited while player 2 gets no runes (no attacker recorded there -> blocked); with runeshare forced off (control) player 2 gets the vanilla share"
# Two emulated-Steam instances (MULTI-INSTANCE.md Â§20): Steam closed, `nro desk` running. The queue is allowed only on emulated
# instances (preflight P7) and nro refuses `mm_queue_*` unless the mod log shows the instance's emulated Steam id.
# Run: nro run scenarios\mi-rw8-runes.toml --mod-dist <dev dist>

[config]            # every instance
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 2
mm_join = true
mm_quiet_invite = true
mm_host_create = false   # never: a lobby made by the mod is not joinable (MATCHMAKING Â§8)

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

# Instance 1 queues first, so its queue lobby is the one instance 2 finds and joins (the lobby owner becomes the host).
[[step]]
instance = 1
console = "mm_queue_solo"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 30 }

[[step]]
instance = 2
console = "mm_queue_solo"

[[step]]
instance = 2
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 60 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 30 }

[[step]]
instance = 1
screenshot = "host_match_ready"

# The host opens its Seamless Co-op lobby the player's way (Matchmaking Settings > Invite Members); the quiet invite swallows the
# invite window, the host's mod invites the roster, gbe auto-accepts on the joiner.
[[step]]
instance = 1
navigate = "invite_members"

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 2
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 1
expect = { console = "log 400", contains = ["mm_join: ALL PRESENT 2/2"] }

[[step]]
instance = 1
screenshot = "host"

[[step]]
instance = 2
screenshot = "joiner"

# The expedition: every party member readies at the table (the party list counts n/2), the host first.
[[step]]
instance = 1
navigate = "commence"

[[step]]
instance = 2
navigate = "commence"

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 2
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

# RW-8: both credit sites are hooked and the filter is on by itself in the match (both builds; MEMORY_MAP Â§21).
[[step]]
instance = 1
wait = { console = "runeshare", contains = ["rivals' kills give no runes", "death credit hooked", "message credit hooked", "rivals 1"], timeout_s = 30 }

[[step]]
instance = 2
wait = { console = "runeshare", contains = ["rivals' kills give no runes", "death credit hooked", "message credit hooked", "rivals 1"], timeout_s = 30 }

# Off the start hawks (the ride needs a few seconds to begin), land.
[[step]]
instance = 1
sleep_ms = 6000

[[step]]
instance = 1
console = "hawk_drop"

[[step]]
instance = 2
console = "hawk_drop"

[[step]]
instance = 1
sleep_ms = 16000

[[step]]
instance = 2
console = "god 1"

[[step]]
instance = 1
console = "god 1"

# --- Filter ON: player 1 "kills" the nearest enemy with the deterministic test aid (mob_kill writes the attacker fields a
# real LOCAL hit fills and sets HP 0; MEMORY_MAP §21). Player 2 stands 4 m away. Player 1's game credits the kill; player 2's
# game has no attacker recorded and (Solo) blocks the credit.
[[step]]
instance = 2
console = "tp_player 1 0 -4"

[[step]]
instance = 2
sleep_ms = 2000

[[step]]
instance = 1
console = "runes_mark"

[[step]]
instance = 2
console = "runes_mark"

[[step]]
instance = 1
console = "mob_kill"

[[step]]
instance = 2
sleep_ms = 3000

[[step]]
instance = 1
wait = { console = "runeshare", contains = ["death credit hooked"], absent = ["(0 credited", "(+0 since mark)"], timeout_s = 20 }

[[step]]
instance = 2
wait = { console = "runeshare", contains = ["(+0 since mark)"], absent = [", 0 blocked"], timeout_s = 20 }

[[step]]
instance = 2
expect = { console = "log 300", contains = ["runeshare: death credit", "-> BLOCKED"] }

[[step]]
instance = 1
expect = { console = "runeshare", contains = [", 0 blocked"], absent = ["(+0 since mark)"] }

[[step]]
instance = 1
screenshot = "p1_after_kill_on"

[[step]]
instance = 2
screenshot = "p2_after_kill_on"

# --- Control: the filter forced off on player 2; the same kill now pays player 2 the vanilla share.
[[step]]
instance = 2
console = "runeshare 0"

[[step]]
instance = 2
console = "runes_mark"

[[step]]
instance = 1
console = "mob_kill"

[[step]]
instance = 2
wait = { console = "runeshare", contains = ["runes as in the game"], absent = ["(+0 since mark)", "runes ?"], timeout_s = 20 }

[[step]]
instance = 1
expect = { console = "runeshare", contains = [", 0 blocked"], absent = ["(+0 since mark)"] }

[[step]]
instance = 2
screenshot = "p2_after_kill_off"

[[step]]
instance = 2
console = "runeshare auto"
