name = "mi-net-join"
about = "NET-1 next to Seamless Co-op: mi-join's flow (instance 2 joins instance 1 in an SC session), then both open the private data channel and ping/pong 120 times each way while the SC session is live; both still list 2 players afterwards (SC unharmed)"
tags = ["mi"]
# Two emulated-Steam instances (MULTI-INSTANCE.md): Steam closed, `nro desk` running, about 7 GB of free RAM per game.
# Run: nro run scenarios\mi-join.toml --mod-dist <dev dist>

[config]            # every instance
team_size = 1
ui_flag_watch = false
net = true

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

[[step]]
instance = 1
screenshot = "host_world"

# Move the host away from wherever the save put it and turn it (back, then sideways), so every run starts the invite from another
# place and heading: the macro must not depend on the spawn.
[[step]]
instance = 1
keys = "S 1800ms; wait 300ms; A 1200ms; wait 800ms"

[[step]]
instance = 1
console = "pos"

# Host: stand at the table (tp with heading), F, Matchmaking Settings, Invite Members; waits for the game's LobbyCreated_t.
[[step]]
instance = 1
navigate = "invite_members"

# The client reloads into the host's Roundtable (it shows `no world` meanwhile).
[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 30 }

# Both Steam ids are members of the host's Seamless Co-op lobby (the mod's lobby probe).
[[step]]
instance = 1
wait_log = { contains = ["nrsc_ynx3_seamless_master_lobby", "members=[76561199023125438, 76561199023125439]"], timeout_s = 30, since = "run" }

[[step]]
instance = 1
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 2
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 1
screenshot = "host"

[[step]]
instance = 2
screenshot = "client"

# NET-1: the data channel while the SC session is live.
[[step]]
instance = 1
console = "net_peer 76561199023125439"

[[step]]
instance = 2
console = "net_peer 76561199023125438"

[[step]]
instance = 1
console = "net_ping 120"

[[step]]
instance = 2
console = "net_ping 120"

[[step]]
instance = 1
wait = { console = "net_status", contains = ["pongs=120"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "net_status", contains = ["pongs=120"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 2
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }
