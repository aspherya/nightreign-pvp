name = "defeat-rival"
about = "RW-1: a rival's hit then 0 HP = defeat for good: the comeback is held, LOCAL stays dead, the defeat screen follows after defeat_exit_secs, then the Roundtable"
tags = ["rules", "slow"]

[config]
mode = "offline"
mm_queue = false
team_size = 1
ui_flag_watch = false
defeat_exit_secs = 15

[[step]]
navigate = "title_to_world"
[[step]]
navigate = "expedition"
[[step]]
puppets = 3
[[step]]
puppet_ring = 6
[[step]]
console = "flag 10007420 1"
[[step]]
console = "rival_hit"
[[step]]
sleep_ms = 1000
[[step]]
console = "hp0"
[[step]]
wait_log = { contains = "defeated by a rival", timeout_s = 40, since = "run" }
[[step]]
wait_log = { contains = "start step HELD", timeout_s = 40, since = "run" }
[[step]]
screenshot = "dead"
[[step]]
expect = { console = "night_status", contains = ["defeated by a rival", "death held"], absent = ["panic", "no free hardware slot"] }
[[step]]
wait_log = { contains = "the defeat screen is asked for", timeout_s = 40, since = "run" }
[[step]]
sleep_ms = 4000
[[step]]
screenshot = "banner"
[[step]]
sleep_ms = 12000
[[step]]
screenshot = "result"
[[step]]
keys = "F; wait 3s"
[[step]]
screenshot = "end1"
[[step]]
keys = "F; wait 3s"
[[step]]
screenshot = "end2"
[[step]]
keys = "F; wait 4s"
[[step]]
screenshot = "end3"
[[step]]
keys = "F; wait 6s"
[[step]]
screenshot = "end4"
[[step]]
wait = { console = "status", contains = "team_type 1", timeout_s = 90 }
[[step]]
screenshot = "roundtable"
[[step]]
console = "status"
[[step]]
expect_log = { contains = ["defeated by a rival", "start step HELD"], absent = ["RELEASED", "panicked at", "no free hardware slot"], since = "run" }
