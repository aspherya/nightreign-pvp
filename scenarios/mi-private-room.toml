name = "mi-private-room"
about = "RW-6: a private room. Both players set the same private_code; the player flow as mi-zero-click (Battle Royale card, Commence, no more keys): the queue searches only lobbies tagged with that code's room, the two meet and the expedition starts by itself as rivals"
tags = ["mi"]
# Two emulated-Steam instances (MULTI-INSTANCE.md 20): Steam closed, `nro desk` running. Companion: mi-private-mismatch.
# Run: nro run scenarios\mi-private-room.toml

[config]            # every instance
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 2
mm_join = true
mm_quiet_invite = true
mm_auto_start = true
br_menu = true
mm_host_create = false
private_code = "Night-Owls"   # normalised to "night-owls"

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

# Instance 1 queues first, so it owns the queue lobby and becomes the host. The player's way: at the table, F opens the menu, the Battle
# Royale card, F is Commence, F closes the game's own dialog. The menu stays open behind it, as for a real player.
[[step]]
instance = 1
navigate = "queue_br"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 20 }

[[step]]
instance = 1
screenshot = "host_searching"

[[step]]
instance = 2
navigate = "queue_br"

[[step]]
instance = 1
mark = "pressed"

[[step]]
instance = 2
mark = "pressed"

# From here on no key and no click: only watching.
[[step]]
instance = 1
wait_log = { contains = ["matchstart: lobby job started"], timeout_s = 60, since = "run" }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait_log = { contains = ["matchstart: ready sent (leader true"], timeout_s = 60, since = "run" }

[[step]]
instance = 2
wait_log = { contains = ["matchstart: ready sent (leader false"], timeout_s = 60, since = "run" }

[[step]]
instance = 1
screenshot = "host_starting"

[[step]]
instance = 2
screenshot = "joiner_starting"

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 180, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 90, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 2
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 1
expect = { console = "mm_status", contains = ["IN EXPEDITION"] }

[[step]]
instance = 2
expect = { console = "mm_status", contains = ["IN EXPEDITION"] }

# The game never tried to open the invite window: nothing had to be suppressed.
[[step]]
instance = 1
expect_log = { contains = ["matchstart: lobby job started"], absent = ["invite dialog suppressed"], since = "run" }

[[step]]
instance = 1
screenshot = "host_expedition"

[[step]]
instance = 2
screenshot = "joiner_expedition"

# The search and the lobby carried the private room, never the public one.
[[step]]
instance = 1
expect_log = { contains = ["(\"room\", \"p-"], absent = ["(\"room\", \"public\")"], since = "run" }

[[step]]
instance = 2
expect_log = { contains = ["(\"room\", \"p-"], absent = ["(\"room\", \"public\")"], since = "run" }
