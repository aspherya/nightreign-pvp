name = "mi-rw9-markers"
about = "RW-9 map markers on one PC: two emulated instances queue Solo and reach the same expedition as rivals; each places a map pin (map open, middle mouse button); the owner keeps it, the rival's game receives the record but shows it on no map, compass or 3D marker (two marker hooks); forcing the filter off on one side brings the rival's pin back (contrast screenshots); a moved pin is hidden again"
# Two emulated-Steam instances (MULTI-INSTANCE.md §20): Steam closed, `nro desk` running (it needs the `mclick` key item).
# Run: nro run scenarios\mi-rw9-markers.toml --mod-dist <dev dist>
[config]            # every instance
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 2
mm_join = true
mm_quiet_invite = true
mm_host_create = false   # never: a lobby made by the mod is not joinable (MATCHMAKING Â§8)

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

# Instance 1 queues first, so its queue lobby is the one instance 2 finds and joins (the lobby owner becomes the host).
[[step]]
instance = 1
console = "mm_queue_solo"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 30 }

[[step]]
instance = 2
console = "mm_queue_solo"

[[step]]
instance = 2
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 60 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "MATCH READY", timeout_s = 30 }

[[step]]
instance = 1
screenshot = "host_match_ready"

# The host opens its Seamless Co-op lobby the player's way (Matchmaking Settings > Invite Members); the quiet invite swallows the
# invite window, the host's mod invites the roster, gbe auto-accepts on the joiner.
[[step]]
instance = 1
navigate = "invite_members"

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "mm_status", contains = "ALL PRESENT", timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 2
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 1
expect = { console = "log 400", contains = ["mm_join: ALL PRESENT 2/2"] }

[[step]]
instance = 1
screenshot = "host"

[[step]]
instance = 2
screenshot = "joiner"

# The expedition: every party member readies at the table (the party list counts n/2), the host first.
[[step]]
instance = 1
navigate = "commence"

[[step]]
instance = 2
navigate = "commence"

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 2"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 2
wait = { console = "players", contains = ["me", "29    rival"], timeout_s = 30, every_ms = 1000 }

# RW-9: the three hooks are in and the filter is on by itself in the match (both builds; MEMORY_MAP Â§20 "Rival filter").
[[step]]
instance = 1
wait = { console = "rivalhud", contains = ["hiding rivals", "rivals [0x", "map / compass hooked", "party bar hooked", "name tag hooked"], timeout_s = 30 }

[[step]]
instance = 2
wait = { console = "rivalhud", contains = ["hiding rivals", "rivals [0x", "map / compass hooked", "party bar hooked", "name tag hooked"], timeout_s = 30 }

# The Solo fallback stays idle while the map site is hooked (one mechanism at a time).
[[step]]
instance = 1
expect = { console = "maphide", contains = ["2 item(s), left to the game"] }

[[step]]
instance = 2
expect = { console = "maphide", contains = ["2 item(s), left to the game"] }

# Off the start hawks (the ride needs a few seconds to begin), land, then player 2 stands 4 m in front of player 1, facing it.
[[step]]
instance = 1
sleep_ms = 6000

[[step]]
instance = 1
console = "hawk_drop"

[[step]]
instance = 2
console = "hawk_drop"

[[step]]
instance = 1
sleep_ms = 16000

[[step]]
instance = 2
console = "tp_player 1 0 -4"

[[step]]
instance = 2
sleep_ms = 3000

# RW-9 markers: both marker hooks are in, each game knows the other's map id (p1 = 1, p2 = 2: `[PlayerIns+0x5A0]+8`).
# Keys: the first key right after the game window gets the focus is lost, so every sequence starts with a pause; the map stays open
# while the other window has the focus; `pos` shows `menu 0x100` while the map is open, `menu 0x0` when closed.
[[step]]
instance = 1
wait = { console = "rivalhud", contains = ["hiding rivals", "rival map ids [2]", "markers on map hooked", "markers in 3D hooked"], absent = ["NOT hooked"], timeout_s = 20 }

[[step]]
instance = 2
wait = { console = "rivalhud", contains = ["hiding rivals", "rival map ids [1]", "markers on map hooked", "markers in 3D hooked"], absent = ["NOT hooked"], timeout_s = 20 }

# Player 1 opens the map (M) and places a pin with the middle mouse button (the map's "Pin" prompt) at the map centre.
[[step]]
instance = 1
keys = "wait 1500ms; M 300ms; wait 2s"

[[step]]
instance = 1
wait = { console = "pos", contains = ["menu 0x100"], timeout_s = 5 }

[[step]]
instance = 1
screenshot = "p1_map_open"

[[step]]
instance = 1
keys = "wait 1500ms; mclick 0.686 0.528; wait 2s"

[[step]]
instance = 1
screenshot = "p1_pinned"

# Player 1 keeps its own pin; player 2 receives the record (the game's marker sharing) but the map / compass list stays empty: the
# map hook refused it (it runs only when a record is new or changed, so its counter, not "now"), the 3D hook refuses it every frame.
[[step]]
instance = 1
wait = { console = "rivalhud", contains = ["map list [1]"], timeout_s = 15 }

[[step]]
instance = 2
wait = { console = "rivalhud", contains = ["records [1]", "map list []", "markers on map hooked", "markers in 3D hooked, hiding a rival now"], absent = ["markers on map hooked, no rival hidden in the last second (0 hidden"], timeout_s = 20 }

[[step]]
instance = 2
screenshot = "p2_rival_pin_hidden"

[[step]]
instance = 2
keys = "wait 1500ms; M 300ms; wait 2s"

[[step]]
instance = 2
wait = { console = "pos", contains = ["menu 0x100"], timeout_s = 5 }

[[step]]
instance = 2
screenshot = "p2_map_rival_pin_hidden"

# Player 2 places its own pin (upper left of the map): it keeps it, player 1 does not get it on its map.
[[step]]
instance = 2
keys = "wait 1500ms; mclick 0.628 0.417; wait 2s"

[[step]]
instance = 2
wait = { console = "rivalhud", contains = ["map list [2]"], timeout_s = 15 }

[[step]]
instance = 2
screenshot = "p2_pinned"

[[step]]
instance = 1
wait = { console = "rivalhud", contains = ["map list [1]", "markers on map hooked", "markers in 3D hooked, hiding a rival now"], absent = ["map list [1, ", "map list [2", "markers on map hooked, no rival hidden in the last second (0 hidden"], timeout_s = 20 }

# Player 1 reopens its map (an open map is not redrawn) for the photo, and leaves it open for the next pins.
[[step]]
instance = 1
keys = "wait 1500ms; Q; wait 2s"

[[step]]
instance = 1
wait = { console = "pos", contains = ["menu 0x0"], timeout_s = 5 }

[[step]]
instance = 1
keys = "wait 1500ms; M 300ms; wait 2s"

[[step]]
instance = 1
wait = { console = "pos", contains = ["menu 0x100"], timeout_s = 5 }

[[step]]
instance = 1
screenshot = "p1_map_rival_pin_hidden"

# Contrast: the filter forced off on player 2, player 1 moves its pin (the map list is synced only when a record changes): the pin is on
# player 2's map list, compass and 3D marker (screenshots *_shown).
[[step]]
instance = 2
console = "rivalhud 0"

[[step]]
instance = 1
keys = "wait 1500ms; mclick 0.640 0.694; wait 2s"

[[step]]
instance = 2
wait = { console = "rivalhud", contains = ["showing everyone", "markers in 3D hooked, no rival hidden in the last second"], absent = ["map list [2]", "map list []"], timeout_s = 20 }

[[step]]
instance = 2
keys = "wait 1500ms; Q; wait 2s"

[[step]]
instance = 2
wait = { console = "pos", contains = ["menu 0x0"], timeout_s = 5 }

[[step]]
instance = 2
screenshot = "p2_rival_pin_shown"

[[step]]
instance = 2
keys = "wait 1500ms; M 300ms; wait 2s"

[[step]]
instance = 2
wait = { console = "pos", contains = ["menu 0x100"], timeout_s = 5 }

[[step]]
instance = 2
screenshot = "p2_map_rival_pin_shown"

# Back to automatic: a pin already on the list stays until its owner moves it; player 1 moves its pin, and it is gone again.
[[step]]
instance = 2
console = "rivalhud auto"

[[step]]
instance = 1
keys = "wait 1500ms; mclick 0.700 0.400; wait 2s"

[[step]]
instance = 2
wait = { console = "rivalhud", contains = ["hiding rivals", "map list [2]", "markers in 3D hooked, hiding a rival now"], timeout_s = 20 }

[[step]]
instance = 2
keys = "wait 1500ms; Q; wait 2500ms; M 300ms; wait 2s"

[[step]]
instance = 2
screenshot = "p2_map_rival_pin_moved_hidden"

[[step]]
instance = 1
expect = { console = "rivalhud", contains = ["markers on map hooked", "markers in 3D hooked", "map / compass hooked", "party bar hooked", "name tag hooked"], absent = ["NOT hooked"] }

[[step]]
instance = 2
expect = { console = "rivalhud", contains = ["markers on map hooked", "markers in 3D hooked", "map / compass hooked", "party bar hooked", "name tag hooked"], absent = ["NOT hooked"] }
