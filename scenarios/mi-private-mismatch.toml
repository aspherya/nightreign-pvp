name = "mi-private-mismatch"
about = "RW-6: two different private codes never meet. Both players queue from the Battle Royale card with their own private_code; after 60 s both are still searching, alone, each in its own room"
tags = ["mi"]
# Two emulated-Steam instances (MULTI-INSTANCE.md 20): Steam closed, `nro desk` running. Companion: mi-private-room.
# Run: nro run scenarios\mi-private-mismatch.toml

[config]            # every instance
team_size = 1
ui_flag_watch = false
mm_probe = true
mm_queue = true
mm_match_players = 2
mm_join = true
mm_quiet_invite = true
mm_auto_start = true
br_menu = true
mm_host_create = false

[[instance]]
n = 1
role = "host"
[instance.config]
private_code = "alpha"

[[instance]]
n = 2
role = "client"
[instance.config]
private_code = "beta"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

[[step]]
instance = 1
navigate = "queue_br"

[[step]]
instance = 1
wait = { console = "mm_status", contains = "searching", timeout_s = 20 }

[[step]]
instance = 2
navigate = "queue_br"

[[step]]
instance = 2
wait = { console = "mm_status", contains = "searching", timeout_s = 20 }

# Long enough for several searches on both sides (one every ~5 s); in mi-private-room the same code meets within seconds.
[[step]]
instance = 1
keys = "wait 60000ms"

[[step]]
instance = 1
expect = { console = "mm_status", contains = "searching", absent = ["MATCH READY", "IN EXPEDITION"] }

[[step]]
instance = 2
expect = { console = "mm_status", contains = "searching", absent = ["MATCH READY", "IN EXPEDITION"] }

[[step]]
instance = 1
screenshot = "host_still_searching"

[[step]]
instance = 1
expect_log = { contains = ["(\"room\", \"p-"], absent = ["(\"room\", \"public\")", "mm_queue: MATCH READY"], since = "run" }

[[step]]
instance = 2
expect_log = { contains = ["(\"room\", \"p-"], absent = ["(\"room\", \"public\")", "mm_queue: MATCH READY"], since = "run" }
