name = "mi-net-verdict"
about = "NET-2: in an SC session (mi-join flow) the data channel finds its peer by itself (the members of the SC lobby, no net_peer), instance 1 publishes `boss 4012 won by team 1` three times, instance 2 records it exactly once and acks it, instance 2 cannot overwrite it; the SC session stays intact"
# Two emulated-Steam instances (MULTI-INSTANCE.md): Steam closed, `nro desk` running, about 7 GB of free RAM per game.
# Run: nro run scenarios\mi-net-verdict.toml --mod-dist <dev dist>

[config]            # every instance
team_size = 1
ui_flag_watch = false
net = true

[[instance]]
n = 1
role = "host"

[[instance]]
n = 2
role = "client"

[[step]]
instance = 1
navigate = "title_to_world"

[[step]]
instance = 2
navigate = "title_to_world"

[[step]]
instance = 1
screenshot = "host_world"

# Move the host away from wherever the save put it and turn it (back, then sideways), so every run starts the invite from another
# place and heading: the macro must not depend on the spawn.
[[step]]
instance = 1
keys = "S 1800ms; wait 300ms; A 1200ms; wait 800ms"

[[step]]
instance = 1
console = "pos"

# Host: stand at the table (tp with heading), F, Matchmaking Settings, Invite Members; waits for the game's LobbyCreated_t.
[[step]]
instance = 1
navigate = "invite_members"

# The client reloads into the host's Roundtable (it shows `no world` meanwhile).
[[step]]
instance = 2
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 120, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "status", contains = ["world loaded, 2 player(s)", "team_type 1"], timeout_s = 30 }

# Both Steam ids are members of the host's Seamless Co-op lobby (the mod's lobby probe).
[[step]]
instance = 1
wait = { console = "log 300", contains = ["nrsc_ynx3_seamless_master_lobby", "members=[76561199023125438, 76561199023125439]"], timeout_s = 30, every_ms = 2000 }

[[step]]
instance = 1
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 2
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 1
screenshot = "host"

[[step]]
instance = 2
screenshot = "client"

# NET-2: the roster comes from the SC lobby (no net_peer anywhere in this scenario).
[[step]]
instance = 1
wait = { console = "net_status", contains = ["peers={76561199023125439}"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 2
wait = { console = "net_status", contains = ["peers={76561199023125438}"], timeout_s = 60, every_ms = 2000 }

# Instance 1 sends the verdict three times; only the first counts (the key is settled after it).
[[step]]
instance = 1
console = "net_verdict 4012 1"

[[step]]
instance = 1
console = "net_verdict 4012 1"

[[step]]
instance = 1
console = "net_verdict 4012 1"

[[step]]
instance = 2
wait = { console = "net_status", contains = ["facts_in=1", "last_fact=1:4012:1"], timeout_s = 60, every_ms = 2000 }

[[step]]
instance = 1
wait = { console = "net_status", contains = ["facts_out=1", "facts_acked=1", "fact_pending=0"], timeout_s = 60, every_ms = 2000 }

# (A Hello that arrives before the receiver's lobby roster has caught up is counted as `strangers` and ignored: expected, so not asserted.)
# Instance 2 tries to overwrite the settled key with another value: refused locally, nothing is sent.
[[step]]
instance = 2
console = "net_verdict 4012 0"

[[step]]
instance = 2
wait = { console = "log 100", contains = ["net: publish topic=1 key=4012 value=0 -> refused"], timeout_s = 30, every_ms = 1000 }

[[step]]
instance = 2
expect = { console = "net_status", contains = ["facts_out=0", "facts_in=1", "fact_conflicts=0", "send_errors=0"], absent = ["last_error"] }

[[step]]
instance = 1
expect = { console = "net_status", contains = ["facts_out=1", "facts_in=0", "send_errors=0"], absent = ["last_error"] }

# The log line the card asks for: instance 2 logged the verdict exactly once.
[[step]]
instance = 2
expect = { console = "log 300", contains = ["net: verdict boss=4012 team=1"] }

# Seamless Co-op unharmed.
[[step]]
instance = 1
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }

[[step]]
instance = 2
expect = { console = "players", contains = ["me", "rival"], absent = ["panic"] }
