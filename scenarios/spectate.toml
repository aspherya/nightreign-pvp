name = "spectate"
about = "RW-1: a defeated player's invisible body is moved to the nearest living player every tick so the follow camera shows them; F10 leaves (the defeat screen). One PC: puppets are the watched players"
tags = ["rules"]

[config]
mode = "offline"
mm_queue = false
team_size = 1
ui_flag_watch = false
defeat_exit_secs = 0

[[step]]
navigate = "title_to_world"
[[step]]
navigate = "expedition"
[[step]]
puppets = 3
[[step]]
puppet_ring = 12
[[step]]
console = "flag 10007420 1"
[[step]]
console = "rival_hit"
[[step]]
sleep_ms = 1000
[[step]]
console = "hp0"
[[step]]
wait = { console = "night_status", contains = "watching", timeout_s = 40 }
[[step]]
console = "puppet_list"
[[step]]
sleep_ms = 3000
[[step]]
screenshot = "watching1"
[[step]]
console = "puppet_list"
[[step]]
wait_log = { contains = "start step HELD", timeout_s = 40, since = "run" }
[[step]]
sleep_ms = 3000
[[step]]
screenshot = "watching2"
[[step]]
expect = { console = "night_status", contains = ["defeated by a rival", "watching", "death held"], absent = ["the defeat screen"] }
[[step]]
keys = "F10"
[[step]]
wait_log = { contains = "the leave key was pressed", timeout_s = 20, since = "run" }
[[step]]
wait_log = { contains = "out of the expedition", timeout_s = 60, since = "run" }
[[step]]
expect_log = { contains = ["spectating player", "the leave key was pressed"], absent = ["panicked at", "no free hardware slot"], since = "run" }
