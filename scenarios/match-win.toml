name = "match-win"
about = "RW-1: the match ends at any time when one team is left: LOCAL is the last standing on Day 1 (puppets down for 15 s) and wins"

[config]
mode = "offline"
mm_queue = false
team_size = 1
ui_flag_watch = false

[[step]]
navigate = "title_to_world"
[[step]]
navigate = "expedition"
[[step]]
console = "god 1"
[[step]]
puppets = 3
[[step]]
puppet_front = 1.2
[[step]]
console = "puppet_hp 1 0"
[[step]]
console = "puppet_hp 2 0"
[[step]]
console = "puppet_hp 3 0"
[[step]]
wait = { console = "log 300", contains = "match decided", timeout_s = 60 }
[[step]]
sleep_ms = 4000
[[step]]
screenshot = "win"
[[step]]
sleep_ms = 8000
[[step]]
screenshot = "win2"
[[step]]
expect = { console = "log 300", contains = ["match decided", "won"], absent = ["panic", "no free hardware slot"] }
