[package]
name = "nrscan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "T-037: read-only external memory scanner (ReadProcessMemory) for the bleed-out clock and the revive bar."

[[bin]]
name = "nrscan"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
]
