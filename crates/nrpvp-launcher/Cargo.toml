[package]
name = "nrpvp-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Double-click launcher for the Nightreign PvP mod: starts the game with Seamless Co-op and nrpvp through a bundled me3."

[[bin]]
name = "nrpvp_launcher"
path = "src/main.rs"

[lib]
name = "nrpvp_launch"
path = "src/lib.rs"

[dependencies]
# The release lookup and version gate (src/release.rs, src/version.rs), shared with the launcher app.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
