# me3 profile for UI-0 step 6a (dev only): same as nrpvp-sc.me3.toml plus a package with the m10 talk bundle recompiled by esdtool, logic unchanged (round-trip load test).
# The package folder dist\ui0-pkg-a holds game-relative files built from the game 1.03.3 unpack (Z:\Tools\nr-unpacked); it is
# gitignored (game content). Package syntax: [[packages]] with id and path ('path' is an alias of 'source', me3 CHANGELOG 8f145b5).
profileVersion = "v1"

[[supports]]
game = "nightreign"

[[natives]]
path = 'Z:\SteamLibrary\steamapps\common\ELDEN RING NIGHTREIGN\Game\SeamlessCoop\nrsc.dll'
load_early = true

[[natives]]
path = '../dist/nrpvp.dll'
load_after = [{ id = "nrsc.dll", optional = false }]

[[packages]]
id = "nrpvp-ui0a"
path = '../dist/ui0-pkg-a'
