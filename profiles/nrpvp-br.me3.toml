# me3 profile: Seamless Co-op + nrpvp.dll + our game-data package (UI-1). Same as nrpvp-sc.me3.toml plus [[packages]].
# dist\gamedata is built by scripts\build-gamedata.ps1 from the game 1.03.3 unpack (Z:\Tools\nr-unpacked); it is gitignored (game
# content): msg\<lang>\menu_dlc01.msgbnd.dcx with our CL_MenuText_dlc01 labels (gamedata\fmg-entries.json).
# Package syntax: [[packages]] with id and path ('path' is an alias of 'source', me3 CHANGELOG 8f145b5).
profileVersion = "v1"

[[supports]]
game = "nightreign"

[[natives]]
path = 'Z:\SteamLibrary\steamapps\common\ELDEN RING NIGHTREIGN\Game\SeamlessCoop\nrsc.dll'
load_early = true

[[natives]]
path = '../dist/nrpvp.dll'
load_after = [{ id = "nrsc.dll", optional = false }]

[[packages]]
id = "nrpvp-gamedata"
path = '../dist/gamedata'
